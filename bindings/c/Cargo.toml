[package]
name = "rustille-capi"
description = "C ABI for Rustille: image-to-Braille rendering for any language that can call C."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "rustille"
crate-type = ["cdylib", "staticlib"]
doc = false

[features]
default = ["decode"]
decode = ["rustille_core/decode"]

[dependencies]
rustille_core = { package = "rustille", path = "../../crates/rustille", default-features = false }
