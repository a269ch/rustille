# cbindgen configuration for the Rustille C ABI.
#
# The header is generated, not committed: `just c-header` (or the CI job)
# writes it to bindings/c/include/rustille.h.

language = "C"
header = """/*
 * rustille.h - C ABI for Rustille (https://github.com/a269ch/rustille)
 *
 * Generated by cbindgen; do not edit by hand.
 *
 * SPDX-License-Identifier: MIT OR Apache-2.0
 */"""
include_guard = "RUSTILLE_H"
pragma_once = false
autogen_warning = ""
include_version = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
after_includes = """
/** Rustille version this header was generated from. */
#define RUSTILLE_VERSION "0.1.0"
#define RUSTILLE_VERSION_MAJOR 0
#define RUSTILLE_VERSION_MINOR 1
#define RUSTILLE_VERSION_PATCH 0
"""

[export]
prefix = ""
include = ["RustilleStatus", "RustilleOptions", "RustilleDither", "RustilleColorMode", "RustilleFit"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
