[package]
name = "rustille"
description = "Turn pixels into Braille: a fast image-to-Unicode-Braille renderer, drawing canvas and CLI."
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Tests and benchmarks are not useful to downstream consumers and would
# otherwise inflate the published .crate file.
exclude = ["tests/**", "benches/**"]

[lib]
name = "rustille"
path = "src/lib.rs"

[[bin]]
name = "rustille"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["decode"]

# Image decoding. `decode` turns on every format Rustille ships with; the
# per-format features exist so downstream crates can keep their dependency
# tree (and wasm binaries) small.
decode = [
    "decode-png",
    "decode-jpeg",
    "decode-webp",
    "decode-bmp",
    "decode-gif",
    "decode-tiff",
]
decode-png = ["_image", "image/png"]
decode-jpeg = ["_image", "image/jpeg"]
decode-webp = ["_image", "image/webp"]
decode-bmp = ["_image", "image/bmp"]
decode-gif = ["_image", "image/gif"]
decode-tiff = ["_image", "image/tiff"]

# Everything the `rustille` binary needs. Library consumers never pay for it.
cli = ["decode", "dep:clap", "dep:anyhow", "dep:terminal_size"]

# Internal: "the `image` crate is available". Not part of the public API.
_image = ["dep:image"]

[dependencies]
thiserror = { workspace = true }
image = { workspace = true, optional = true }
clap = { version = "4.5", features = ["derive", "wrap_help"], optional = true }
anyhow = { version = "1.0", optional = true }
terminal_size = { version = "0.4", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Encoders, so that tests can synthesise their own fixtures instead of shipping
# opaque binary blobs.
image = { workspace = true, features = ["png", "jpeg", "bmp", "gif", "tiff"] }

[[bench]]
name = "braille"
harness = false

[[bench]]
name = "render"
harness = false

[[example]]
name = "canvas_shapes"

[[example]]
name = "render_gradient"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
